# /etc/nginx/sites-available/wifi-auth.conf
# nginx trên RDS chỉ phục vụ: đăng nhập Google (/auth/) và trang lỗi của backend (/<trường>/error.html).
# Trang portal chính nằm trên pfSense Captive Portal.
#
# Mỗi trường có tên miền backend + chứng chỉ riêng (khớp public_base_url trong /etc/wifi-auth/config.json):
#   WASS  -> auth.truongtayuc.edu.vn
#   Penn  -> auth.penn.edu.vn
#   RT    -> auth.rtholdings.edu.vn
# Trường nào CHƯA có chứng chỉ thì XOÁ hoặc chú thích (#) khối server của trường đó, nếu không `nginx -t` sẽ báo lỗi.

server {
    listen 80;
    server_name auth.truongtayuc.edu.vn auth.penn.edu.vn auth.rtholdings.edu.vn;
    return 301 https://$host$request_uri;
}

# ---------- WASS ----------
server {
    listen 443 ssl;
    server_name auth.truongtayuc.edu.vn;
    ssl_certificate     /etc/letsencrypt/live/auth.truongtayuc.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.truongtayuc.edu.vn/privkey.pem;
    include /etc/nginx/snippets/wifi-auth-common.conf;
}

# ---------- Penn ----------
server {
    listen 443 ssl;
    server_name auth.penn.edu.vn;
    ssl_certificate     /etc/letsencrypt/live/auth.penn.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.penn.edu.vn/privkey.pem;
    include /etc/nginx/snippets/wifi-auth-common.conf;
}

# ---------- RT Holdings ----------
server {
    listen 443 ssl;
    server_name auth.rtholdings.edu.vn;
    ssl_certificate     /etc/letsencrypt/live/auth.rtholdings.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.rtholdings.edu.vn/privkey.pem;
    include /etc/nginx/snippets/wifi-auth-common.conf;
}
