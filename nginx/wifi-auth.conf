# /etc/nginx/sites-available/wifi-auth.conf
# nginx trên RDS chỉ phục vụ: đăng nhập Google (/auth/) và trang lỗi của backend (/<nơi>/error.html).
# Trang portal chính (giao diện WASS / Penn / RT) nằm trên pfSense Captive Portal.
# Một backend dùng chung cho cả 3 nơi: auth.truongtayuc.edu.vn -> RDS 172.16.203.20

server {
    listen 80;
    server_name auth.truongtayuc.edu.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.truongtayuc.edu.vn;
    ssl_certificate     /etc/letsencrypt/live/auth.truongtayuc.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.truongtayuc.edu.vn/privkey.pem;
    include /etc/nginx/snippets/wifi-auth-common.conf;
}
