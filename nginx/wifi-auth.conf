# /etc/nginx/sites-available/wifi-auth.conf
# nginx trên RDS chỉ phục vụ: đăng nhập Google (/auth/) và trang lỗi của backend (/wass/error.html, /penn/error.html).
# Trang portal chính nằm trên pfSense Captive Portal.
# Thay wifi.truongtayuc.edu.vn bằng tên miền thật; chứng chỉ lấy bằng certbot (DNS-01) — xem HUONG-DAN.md
server {
    listen 80;
    server_name wifi.truongtayuc.edu.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wifi.truongtayuc.edu.vn;

    ssl_certificate     /etc/letsencrypt/live/wifi.truongtayuc.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wifi.truongtayuc.edu.vn/privkey.pem;

    root /var/www/wifi;            # chứa wass/error.html và penn/error.html

    location = /wass/error.html { try_files $uri =404; }
    location = /penn/error.html { try_files $uri =404; }

    location /auth/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8090; }

    # Không bao giờ mở /radius/ ra ngoài
    location /radius/ { return 404; }
    location / { return 404; }
}
