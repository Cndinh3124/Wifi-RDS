# /etc/nginx/snippets/wifi-auth-common.conf — phần chung cho mọi tên miền backend
root /var/www/wifi;            # chứa wass/error.html, penn/error.html, rt/error.html

location ~ ^/(wass|penn|rt)/error\.html$ { try_files $uri =404; }

location /auth/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /healthz { proxy_pass http://127.0.0.1:8090; }

# Không bao giờ mở /radius/ ra ngoài
location /radius/ { return 404; }
location / { return 404; }
