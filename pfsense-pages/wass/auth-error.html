<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WASS Wi-Fi — Không thể kết nối</title>
<style>
  :root{--c:#B32025;--cd:#8E161B;--cs:#FBEDEE;--a:#B32025;--ink:#1F1F24;--muted:#6B6B75;--line:#E6E3E3}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
       background:radial-gradient(1200px 600px at 50% -10%,var(--cs),#fff 60%);display:flex;align-items:center;justify-content:center;padding:32px 18px}
  .card{width:100%;max-width:460px;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(20,20,40,.10),0 2px 6px rgba(20,20,40,.05);overflow:hidden;border-top:6px solid var(--c)}
  .in{padding:36px 36px 30px;text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
  .brand img{width:52px;height:52px}
  .brand .n1{font-family:Georgia,serif;font-weight:700;color:var(--c);font-size:18px;letter-spacing:.02em;text-align:left}
  .brand .n2{font-size:12px;color:var(--muted);text-align:left}
  .ic{width:76px;height:76px;border-radius:50%;background:var(--cs);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .ic svg{width:38px;height:38px;stroke:var(--c);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:23px;line-height:1.3}
  .msg{color:var(--muted);font-size:15px;line-height:1.6;margin:10px 0 22px}
  ul{list-style:none;text-align:left;background:#F8F8FA;border-radius:12px;padding:14px 16px;margin-bottom:24px}
  li{font-size:14px;line-height:1.5;padding:6px 0 6px 26px;position:relative;color:#3a3a44}
  li::before{content:"";position:absolute;left:4px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--a)}
  .btn{display:block;width:100%;height:50px;line-height:50px;border-radius:10px;background:var(--c);color:#fff;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer}
  .btn:hover{background:var(--cd)}
  .code{margin-top:14px;font-size:12px;color:#9a9aa3}
  .help{border-top:1px solid var(--line);padding:18px 36px;font-size:13px;color:var(--muted);line-height:1.7;text-align:center;background:#FCFCFD}
  .help b{color:var(--ink)}
  @media (max-width:420px){.in{padding:28px 22px 24px}.help{padding:16px 22px}}
</style>
</head>
